name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: AuditoriaZabbix-${{ github.ref_name }}-windows
          - os: ubuntu-latest
            asset_name: AuditoriaZabbix-${{ github.ref_name }}-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de sistema (Tkinter no Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Verificar Tkinter disponível
        run: python -c "import tkinter"

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências do projeto
        run: pip install -r requirements.txt

      - name: Instalar PyInstaller
        run: pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build com PyInstaller
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Empacotar artefato (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AuditoriaZabbix/*" -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Empacotar artefato (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C dist AuditoriaZabbix

      - name: Upload artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
