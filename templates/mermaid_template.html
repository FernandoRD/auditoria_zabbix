<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background-color: white; padding: 15px; border-radius: 8px; }
        __EXTRA_STYLE__
    </style>
</head>
<body>
    <div id="mermaid-container">__CODE__</div>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            fontFamily: "__FONT__"__THEME_VARS____XYCHART_CONFIG__
        });
        async function renderMermaid() {
            try {
                const element = document.getElementById('mermaid-container');
                const { svg } = await mermaid.render('graphDiv', element.textContent);
                element.innerHTML = svg;
            } catch (err) {
                document.getElementById('mermaid-container').innerHTML = '<svg width="400" height="80"><text x="10" y="40" fill="red">Erro ao renderizar gráfico.</text><text x="10" y="60" fill="red">Sintaxe Mermaid inválida.</text></svg>';
            }
        }
        renderMermaid();
    </script>
</body>
</html>
